services:
  mockport:
    image: ${MOCKPORT_IMAGE:?Set MOCKPORT_IMAGE to a verified ghcr.io digest}
    command: ["run", "--config", "/etc/mockport/mockport.yml", "--host", "0.0.0.0"]
    volumes:
      - ./mockport-compose.yml:/etc/mockport/mockport.yml:ro
    ports:
      - "127.0.0.1:43101:43101"
    networks: [isolated]
  app:
    build: ./stripe-app
    environment:
      MOCKPORT_BASE_URL: http://mockport:43101
      STRIPE_SECRET_KEY: mockport_stripe_secret
      STRIPE_WEBHOOK_SECRET: whsec_mockport
      HOST: 0.0.0.0
    ports:
      - "127.0.0.1:33001:33001"
    depends_on: [mockport]
    networks: [isolated]
  openai-app:
    build: ./openai-app
    environment:
      OPENAI_BASE_URL: http://mockport:43101/openai/v1
      OPENAI_API_KEY: mockport_openai_key
      HOST: 0.0.0.0
    ports:
      - "127.0.0.1:33002:33002"
    depends_on: [mockport]
    networks: [isolated]
  slack-app:
    build: ./slack-app
    environment:
      SLACK_BASE_URL: http://mockport:43101/slack/api/
      SLACK_BOT_TOKEN: mockport_slack_token
      SLACK_SIGNING_SECRET: mockport_slack_signing_secret
      HOST: 0.0.0.0
    ports:
      - "127.0.0.1:33003:33003"
    depends_on: [mockport]
    networks: [isolated]
  runner:
    build:
      context: .
      dockerfile: Dockerfile.runner
    volumes:
      - ./stripe-app/e2e.mjs:/test/stripe.mjs:ro
      - ./openai-app/e2e.py:/test/openai.py:ro
      - ./slack-app/e2e.py:/test/slack.py:ro
      - ../../compat/fixtures/slack/events_message_callback.json:/test/slack-fixture.json:ro
    environment:
      MOCKPORT_BASE_URL: http://127.0.0.1:43101
      PUBLISHED_FLOWS: ${PUBLISHED_FLOWS:-p0p1}
    network_mode: service:mockport
    depends_on: [mockport, app, openai-app, slack-app]
    command: ["sh", "-c", "APP_BASE_URL=http://app:33001 node /test/stripe.mjs && APP_BASE_URL=http://openai-app:33002 python3 /test/openai.py success && if [ \"$$PUBLISHED_FLOWS\" = all ]; then APP_BASE_URL=http://slack-app:33003 SLACK_EVENT_FIXTURE=/test/slack-fixture.json python3 /test/slack.py; elif [ \"$$PUBLISHED_FLOWS\" != p0p1 ]; then echo 'PUBLISHED_FLOWS must be p0p1 or all' >&2; exit 2; fi"]

networks:
  isolated:
    internal: true
