name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.5"
          cache: true
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: "contract/sdk/package-lock.json"
      - run: go vet ./...
      - run: go install honnef.co/go/tools/cmd/staticcheck@v0.7.0
      - run: $(go env GOPATH)/bin/staticcheck ./...
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.3.0
      - run: $(go env GOPATH)/bin/govulncheck ./...
      - run: go build ./cmd/mockport
      - run: bash scripts/check-go-engineering.sh
      - run: bash ci/run-full.sh

  build:
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.5"
      - name: Build archive
        run: scripts/build-release-archives.sh "${GITHUB_REF_NAME#v}" dist "${{ matrix.goos }}" "${{ matrix.goarch }}"
      - uses: actions/upload-artifact@v7
        with:
          name: mockport-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/mockport_*.tar.gz
            dist/checksums.txt

  github-release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
      - name: Merge checksums
        run: |
          find dist -name checksums.txt -exec cat {} + | sort -u > checksums.txt
          find dist -name 'mockport_*.tar.gz' -exec mv {} . \;
      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            mockport_*.tar.gz
            checksums.txt
